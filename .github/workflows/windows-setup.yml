name: Windows setup

on:
  push:
    paths:
      - "windows/**"
      - "web/public/app/**"
      - "supabase/migrations/**"
      - ".github/workflows/windows-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis
      - name: Build universal installer
        run: windows/build-installer.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Pocket-Setup
          path: windows/bin/installer/Pocket-Setup.exe
          if-no-files-found: error
          compression-level: 0

  install:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: Pocket-Setup
      - name: Check setup and removal
        shell: pwsh
        run: ./windows/test-installer.ps1 -Setup ./Pocket-Setup.exe -Architecture ${{ matrix.architecture }}
