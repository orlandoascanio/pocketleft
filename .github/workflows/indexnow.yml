# After a push to main deploys on Netlify, tell Bing and other IndexNow engines what changed.
# Netlify doesn't report deploys back to GitHub, so this waits until /build-id.txt on the live
# site shows the pushed commit, then submits every sitemap URL.
name: Submit pages to IndexNow
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this commit to be live
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 60); do
            live=$(curl -fsSL "https://pocketleft.app/build-id.txt?t=$attempt" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live after $attempt checks."; exit 0; fi
            sleep 20
          done
          echo "Commit $GITHUB_SHA never went live (last seen: ${live:-nothing}). Check the Netlify deploy."
          exit 1
      - name: Submit sitemap URLs
        run: node web/scripts/indexnow.mjs
